<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F5F7;
    --surface: #FFFFFF;
    --ink: #22262E;
    --muted: #5A606B;
    --edge: #BFBFBF;
    --dot: #22262E;
    --dot-ring: #F4F5F7;
    --red: #D93636;
    --blue: #2F6FD6;
    --gold: #FFC400;
    --line-soft: #D9DCE1;
    --on-color: #FFFFFF;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17191E;
      --surface: #22252C;
      --ink: #ECEDEF;
      --muted: #A4A9B3;
      --edge: #4C515C;
      --dot: #ECEDEF;
      --dot-ring: #17191E;
      --red: #EE5050;
      --blue: #5A8DF0;
      --gold: #FFC83D;
      --line-soft: #3A3E47;
      --on-color: #FFFFFF;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17191E; --surface: #22252C; --ink: #ECEDEF; --muted: #A4A9B3;
    --edge: #4C515C; --dot: #ECEDEF; --dot-ring: #17191E; --red: #EE5050;
    --blue: #5A8DF0; --gold: #FFC83D; --line-soft: #3A3E47; --on-color: #FFFFFF;
    color-scheme: dark;
  }

  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 20px 32px;
    display: grid;
    gap: 18px 48px;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "head" "status" "board" "rules" "controls";
  }
  @media (min-width: 860px) {
    .app {
      padding: 40px 32px;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
      grid-template-areas:
        "board head"
        "board status"
        "board rules"
        "board controls";
      grid-template-rows: auto auto auto 1fr;
      align-items: start;
    }
  }

  header {
    grid-area: head;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    column-gap: 20px;
    row-gap: 4px;
  }
  h1 {
    font-family: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(48px, 9vw, 72px);
    line-height: 0.95;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .tagline { margin: 0; color: var(--muted); font-size: 18px; }
  .lang-btn {
    margin-left: auto;
    align-self: center;
    font: inherit; font-size: 14px; font-weight: 700;
    color: var(--ink); background: var(--surface);
    border: 1.5px solid var(--line-soft); border-radius: 999px;
    padding: 6px 14px; cursor: pointer;
  }

  .status {
    grid-area: status;
    background: var(--red);
    color: var(--on-color);
    border-radius: 10px;
    padding: 9px 14px;
    text-align: center;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.25;
    min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    transition: background-color .25s ease;
  }
  .status.blue { background: var(--blue); }

  .board-wrap { grid-area: board; }
  svg.board {
    display: block;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    height: auto;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .edge { stroke: var(--edge); stroke-width: 11; stroke-linecap: round; transition: stroke .15s ease, opacity .25s ease, stroke-width .2s ease; }
  .edge.R { stroke: var(--red); }
  .edge.B { stroke: var(--blue); }
  .edge.preview-R { stroke: var(--red); opacity: .45; }
  .edge.preview-B { stroke: var(--blue); opacity: .45; }
  .edge.faded { opacity: .25; }
  .edge.losing { stroke-width: 19; }
  .glow { stroke: var(--gold); stroke-width: 26; stroke-linecap: round; opacity: .85; filter: url(#soft); pointer-events: none; }
  .hit { stroke: transparent; stroke-width: 30; stroke-linecap: round; cursor: pointer; outline: none; }
  .hit.taken { cursor: default; }
  .hit:focus-visible + .focus-ring { opacity: 1; }
  .focus-ring { stroke: var(--ink); stroke-width: 3; stroke-dasharray: 6 6; fill: none; opacity: 0; pointer-events: none; }
  .dot { fill: var(--dot); stroke: var(--dot-ring); stroke-width: 4; pointer-events: none; }

  .rules { grid-area: rules; }
  .rule-main {
    flex-basis: 100%;
    margin: 12px 0 0;
    font-weight: 400;
    font-size: 19px;
    line-height: 1.4;
  }
  .rule-sub { margin: 0; color: var(--muted); font-size: 15px; }

  .controls { grid-area: controls; display: grid; gap: 14px; }
  .field { display: grid; gap: 6px; }
  .field-name { font-size: 14px; color: var(--muted); font-weight: 700; }
  .seg {
    display: flex;
    background: var(--surface);
    border: 1.5px solid var(--line-soft);
    border-radius: 12px;
    padding: 3px;
    gap: 3px;
  }
  .seg button {
    flex: 1 1 0;
    min-width: 0;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 9px;
    padding: 10px 6px;
    cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .actions { display: flex; gap: 10px; margin: 0 0 16px; }
  .btn {
    font: inherit; font-size: 17px; font-weight: 700;
    border-radius: 12px; padding: 13px 22px; cursor: pointer;
    border: 1.5px solid var(--ink);
  }
  .btn.primary { background: var(--ink); color: var(--bg); flex: 1.4 1 0; }
  .btn.secondary { background: var(--surface); color: var(--ink); flex: 1 1 0; }
  .btn:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .edge, .status { transition: none; }
  }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Sim</h1>
    <p class="tagline" data-i18n="tagline">A graph theory game</p>
    <button type="button" class="lang-btn" id="langBtn" lang="zh">中文</button>
    <p class="rule-main" data-i18n-html="rule">Take turns clicking grey lines. The first player to complete a unicolor triangle <strong>loses</strong>.</p>
  </header>

  <div class="status" id="status" role="status" aria-live="polite">Red’s turn</div>

  <div class="board-wrap">
    <svg class="board" id="board" viewBox="0 0 400 400" aria-label="Sim board: six dots joined by fifteen lines">
      <defs>
        <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4"/>
        </filter>
      </defs>
      <g id="glowLayer"></g>
      <g id="edgeLayer"></g>
      <g id="hitLayer"></g>
      <g id="dotLayer"></g>
    </svg>
  </div>

  <section class="rules">
    <div class="actions">
      <button type="button" class="btn primary" id="newBtn" data-i18n="newGame">New game</button>
      <button type="button" class="btn secondary" id="undoBtn" data-i18n="undo">Undo</button>
    </div>
    <p class="rule-sub" data-i18n="sub">Use the buttons below to choose your opponent and who starts.</p>
  </section>

  <section class="controls">
    <div class="field">
      <span class="field-name" id="oppLabel" data-i18n="opponent">Opponent</span>
      <div class="seg" role="group" aria-labelledby="oppLabel" id="modeSeg">
        <button type="button" data-mode="EASY" data-i18n="easy">Easy AI</button>
        <button type="button" data-mode="HARD" data-i18n="hard">Hard AI</button>
        <button type="button" data-mode="2P" data-i18n="friend">Friend</button>
      </div>
    </div>
    <div class="field">
      <span class="field-name" id="firstLabel" data-i18n="starts">Who starts</span>
      <div class="seg" role="group" aria-labelledby="firstLabel" id="firstSeg">
        <button type="button" data-first="R">Red</button>
        <button type="button" data-first="B">Blue</button>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var C = 200, RAD = 160;
  var P = [];
  for (var i = 0; i < 6; i++) {
    var a = (-90 + 60 * i) * Math.PI / 180;
    P.push({ x: C + RAD * Math.cos(a), y: C + RAD * Math.sin(a) });
  }
  var EDGES = [];
  for (var u = 0; u < 6; u++) for (var v = u + 1; v < 6; v++) EDGES.push([u, v]);
  function key(a, b) { return a < b ? a + "-" + b : b + "-" + a; }

  var T = {
    en: {
      title: "Sim", tagline: "A graph theory game",
      rule: "Take turns clicking grey lines. The first player to complete a unicolor triangle <strong>loses</strong>.",
      sub: "Use the buttons below to choose your opponent and who starts.",
      opponent: "Opponent", starts: "Who starts", easy: "Easy AI", hard: "Hard AI", friend: "Friend",
      newGame: "New game", undo: "Undo", red: "Red", blue: "Blue", you: "You", ai: "AI",
      turn: function (p) { return p + "’s turn"; },
      yourTurn: "Your turn (Red)", thinking: "AI is thinking…",
      twoLose: function (l, w) { return l + " made a triangle. " + w + " wins!"; },
      youLose: "You made a triangle. The AI wins.", aiLose: "The AI made a triangle. You win!",
      board: "Sim board: six dots joined by fifteen lines",
      line: function (a, b) { return "Line from dot " + a + " to dot " + b; },
      owned: function (p) { return ", " + p; }, latest: ", latest move",
      switchTo: "中文", switchLang: "zh"
    },
    zh: {
      title: "Sim 图论游戏", tagline: "图论游戏",
      rule: "轮流点击灰色线段。最先连成同色三角形的一方<strong>输</strong>。",
      sub: "用下面的按钮选择对手和先手。",
      opponent: "对手", starts: "先手", easy: "简单 AI", hard: "困难 AI", friend: "朋友",
      newGame: "新游戏", undo: "悔棋", red: "红方", blue: "蓝方", you: "你", ai: "AI",
      turn: function (p) { return "轮到" + p; },
      yourTurn: "轮到你（红方）", thinking: "AI 正在思考…",
      twoLose: function (l, w) { return l + "连成了三角形，" + w + "获胜！"; },
      youLose: "你连成了三角形，AI 获胜。", aiLose: "AI 连成了三角形，你赢了！",
      board: "Sim 棋盘：六个点由十五条线相连",
      line: function (a, b) { return "连接点 " + a + " 和点 " + b + " 的线"; },
      owned: function (p) { return "，" + p; }, latest: "，最新一步",
      switchTo: "English", switchLang: "en"
    }
  };
  var lang = "en";
  try {
    var savedLang = localStorage.getItem("sim-lang");
    if (savedLang === "en" || savedLang === "zh") lang = savedLang;
    else if (/^zh/i.test(navigator.language || "")) lang = "zh";
  } catch (e) { if (/^zh/i.test(navigator.language || "")) lang = "zh"; }
  function t() { return T[lang]; }

  var S = {
    owner: {}, hist: [], turn: "R", over: false, losing: null,
    mode: "EASY", first: "R", busy: false, timer: null, hover: null
  };

  try {
    var saved = JSON.parse(localStorage.getItem("sim-settings") || "{}");
    if (["2P", "EASY", "HARD"].indexOf(saved.mode) >= 0) S.mode = saved.mode;
    if (saved.first === "R" || saved.first === "B") S.first = saved.first;
  } catch (e) {}
  function saveSettings() {
    try { localStorage.setItem("sim-settings", JSON.stringify({ mode: S.mode, first: S.first })); } catch (e) {}
  }

  // ---------- build the SVG ----------
  var glowLayer = document.getElementById("glowLayer");
  var edgeLayer = document.getElementById("edgeLayer");
  var hitLayer = document.getElementById("hitLayer");
  var dotLayer = document.getElementById("dotLayer");
  var svg = document.getElementById("board");
  var lineEls = {}, glowEls = {}, hitEls = {};

  function mkLine(p, q, cls) {
    var l = document.createElementNS(NS, "line");
    l.setAttribute("x1", p.x); l.setAttribute("y1", p.y);
    l.setAttribute("x2", q.x); l.setAttribute("y2", q.y);
    l.setAttribute("class", cls);
    return l;
  }
  EDGES.forEach(function (e) {
    var k = key(e[0], e[1]), p = P[e[0]], q = P[e[1]];
    var g = mkLine(p, q, "glow"); g.style.display = "none"; glowLayer.appendChild(g); glowEls[k] = g;
    var l = mkLine(p, q, "edge"); edgeLayer.appendChild(l); lineEls[k] = l;
    var h = mkLine(p, q, "hit");
    h.setAttribute("tabindex", "0");
    h.setAttribute("role", "button");
    h.setAttribute("aria-label", "Line from dot " + (e[0] + 1) + " to dot " + (e[1] + 1));
    h.dataset.k = k;
    hitLayer.appendChild(h);
    var ring = mkLine(p, q, "focus-ring"); hitLayer.appendChild(ring);
    hitEls[k] = h;
    h.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); humanMove(k); }
    });
  });
  P.forEach(function (p) {
    var c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", p.x); c.setAttribute("cy", p.y); c.setAttribute("r", 13);
    c.setAttribute("class", "dot");
    dotLayer.appendChild(c);
  });

  // Pointer: pick the nearest free line to where the person tapped.
  function svgPoint(ev) {
    var pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function distToSeg(px, py, a, b) {
    var dx = b.x - a.x, dy = b.y - a.y;
    var t = ((px - a.x) * dx + (py - a.y) * dy) / (dx * dx + dy * dy);
    t = Math.max(0, Math.min(1, t));
    var x = a.x + t * dx, y = a.y + t * dy;
    return Math.hypot(px - x, py - y);
  }
  function nearestFree(ev) {
    var p = svgPoint(ev), best = null, bd = 24;
    EDGES.forEach(function (e) {
      var k = key(e[0], e[1]);
      if (S.owner[k]) return;
      var d = distToSeg(p.x, p.y, P[e[0]], P[e[1]]);
      if (d < bd) { bd = d; best = k; }
    });
    return best;
  }
  svg.addEventListener("click", function (ev) {
    var k = nearestFree(ev);
    if (k) humanMove(k);
  });
  svg.addEventListener("pointermove", function (ev) {
    if (ev.pointerType !== "mouse") return;
    var k = (S.over || S.busy || isComputerTurn()) ? null : nearestFree(ev);
    if (k !== S.hover) { S.hover = k; render(); }
  });
  svg.addEventListener("pointerleave", function () { if (S.hover) { S.hover = null; render(); } });

  // ---------- game logic ----------
  function other(p) { return p === "R" ? "B" : "R"; }
  function isComputerTurn() { return S.mode !== "2P" && S.turn === "B"; }
  function completes(owner, a, b, p) {
    for (var k = 0; k < 6; k++) {
      if (k === a || k === b) continue;
      if (owner[key(a, k)] === p && owner[key(b, k)] === p) return k;
    }
    return -1;
  }
  function countSafe(owner, p) {
    var n = 0;
    EDGES.forEach(function (e) {
      if (!owner[key(e[0], e[1])] && completes(owner, e[0], e[1], p) < 0) n++;
    });
    return n;
  }

  function playMove(k) {
    var parts = k.split("-").map(Number), p = S.turn;
    S.owner[k] = p;
    S.hist.push(k);
    var third = completes(S.owner, parts[0], parts[1], p);
    if (third >= 0) {
      S.over = true;
      S.losing = [key(parts[0], parts[1]), key(parts[0], third), key(parts[1], third)];
    } else {
      S.turn = other(p);
    }
  }

  function humanMove(k) {
    if (S.over || S.busy || S.owner[k] || isComputerTurn()) return;
    S.hover = null;
    playMove(k);
    render();
    if (!S.over && isComputerTurn()) scheduleComputer();
  }

  function scheduleComputer() {
    S.busy = true;
    render();
    S.timer = setTimeout(function () {
      S.timer = null;
      computerMove();
      S.busy = false;
      render();
    }, 650);
  }

  function computerMove() {
    var best = null, bestScore = -Infinity;
    EDGES.forEach(function (e) {
      var k = key(e[0], e[1]);
      if (S.owner[k]) return;
      var score;
      if (completes(S.owner, e[0], e[1], "B") >= 0) score = -1000;
      else if (S.mode === "EASY") score = 0;
      else {
        S.owner[k] = "B";
        score = 2 * countSafe(S.owner, "B") - countSafe(S.owner, "R");
        delete S.owner[k];
      }
      score += Math.random() * 0.9;
      if (score > bestScore) { bestScore = score; best = k; }
    });
    if (best) playMove(best);
  }

  function cancelComputer() {
    if (S.timer) { clearTimeout(S.timer); S.timer = null; }
    S.busy = false;
  }

  function newGame() {
    cancelComputer();
    S.owner = {}; S.hist = []; S.over = false; S.losing = null; S.hover = null;
    S.turn = S.first;
    render();
    if (isComputerTurn()) scheduleComputer();
  }

  function turnAfter(n) { return n % 2 === 0 ? S.first : other(S.first); }

  function undo() {
    cancelComputer();
    var n = S.hist.length;
    if (n === 0) return;
    var keep = n - 1;
    if (S.mode !== "2P") {
      if (turnAfter(keep) === "B") keep--;
      var minKeep = S.first === "B" ? 1 : 0;
      if (keep < minKeep) keep = minKeep;
    }
    if (keep >= n) { render(); return; }
    var moves = S.hist.slice(0, keep);
    S.owner = {}; S.hist = []; S.over = false; S.losing = null; S.turn = S.first;
    moves.forEach(function (k) { S.owner[k] = S.turn; S.hist.push(k); S.turn = other(S.turn); });
    render();
    if (isComputerTurn()) scheduleComputer();
  }

  // ---------- rendering ----------
  var statusEl = document.getElementById("status");
  var undoBtn = document.getElementById("undoBtn");
  function name(p) { return p === "R" ? t().red : t().blue; }

  function statusText() {
    if (S.over) {
      var loser = S.owner[S.losing[0]];
      if (S.mode === "2P") return t().twoLose(name(loser), name(other(loser)));
      return loser === "R" ? t().youLose : t().aiLose;
    }
    if (S.mode === "2P") return t().turn(name(S.turn));
    if (S.turn === "R") return t().yourTurn;
    return t().thinking;
  }

  function render() {
    var last = S.hist.length ? S.hist[S.hist.length - 1] : null;
    EDGES.forEach(function (e) {
      var k = key(e[0], e[1]), o = S.owner[k], cls = "edge";
      if (o) cls += " " + o;
      else if (S.hover === k) cls += " preview-" + S.turn;
      if (S.over) {
        if (S.losing.indexOf(k) >= 0) cls += " losing";
        else cls += " faded";
      }
      lineEls[k].setAttribute("class", cls);
      glowEls[k].style.display = (k === last) ? "" : "none";
      hitEls[k].setAttribute("class", o ? "hit taken" : "hit");
      hitEls[k].setAttribute("aria-disabled", o || S.over ? "true" : "false");
      var lbl = t().line(e[0] + 1, e[1] + 1);
      if (o) lbl += t().owned(name(o)) + (k === last ? t().latest : "");
      hitEls[k].setAttribute("aria-label", lbl);
    });

    var winnerColor = S.over ? other(S.owner[S.losing[0]]) : S.turn;
    statusEl.textContent = statusText();
    statusEl.classList.toggle("blue", winnerColor === "B");

    document.querySelectorAll("#modeSeg button").forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.mode === S.mode ? "true" : "false");
    });
    var fb = document.querySelectorAll("#firstSeg button");
    fb[0].textContent = S.mode === "2P" ? t().red : t().you;
    fb[1].textContent = S.mode === "2P" ? t().blue : t().ai;
    fb.forEach(function (b) {
      b.setAttribute("aria-pressed", b.dataset.first === S.first ? "true" : "false");
    });

    var canUndo = S.hist.length > 0 && !(S.mode !== "2P" && S.first === "B" && S.hist.length <= 1);
    undoBtn.disabled = !canUndo;
  }

  // ---------- language ----------
  var langBtn = document.getElementById("langBtn");
  function applyLang() {
    var d = t();
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = d.title;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = d[el.dataset.i18n]; });
    document.querySelectorAll("[data-i18n-html]").forEach(function (el) { el.innerHTML = d[el.dataset.i18nHtml]; });
    svg.setAttribute("aria-label", d.board);
    langBtn.textContent = d.switchTo;
    langBtn.setAttribute("lang", d.switchLang === "zh" ? "zh-CN" : "en");
    render();
  }
  langBtn.addEventListener("click", function () {
    lang = lang === "en" ? "zh" : "en";
    try { localStorage.setItem("sim-lang", lang); } catch (e) {}
    applyLang();
  });

  // ---------- controls ----------
  document.getElementById("modeSeg").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    if (S.mode === b.dataset.mode) return;
    S.mode = b.dataset.mode; saveSettings(); newGame();
  });
  document.getElementById("firstSeg").addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    if (S.first === b.dataset.first) return;
    S.first = b.dataset.first; saveSettings(); newGame();
  });
  document.getElementById("newBtn").addEventListener("click", newGame);
  undoBtn.addEventListener("click", undo);

  newGame();
  applyLang();
})();
</script>
</body>
</html>
